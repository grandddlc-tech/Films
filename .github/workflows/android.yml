name: Build Android APK
on:
  push:
    branches: [main, ccr-6454f501-taft7m]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../FilmEnglish.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FilmEnglish-apk
          path: FilmEnglish.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" FilmEnglish.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Film English $TAG" \
            --notes "Android APK built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download FilmEnglish.apk and open it on your phone to install." \
            --latest
